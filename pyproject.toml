[project]
name = "finalproject_kapustin_26_555"
version = "0.1.0"
description = "ValutaTrade Hub — консольный симулятор валютного кошелька (итоговый проект)"
readme = "README.md"
authors = [
    { name = "kapustindv1984-beep", email = "kapustindv1984@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "prettytable>=3.18.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
